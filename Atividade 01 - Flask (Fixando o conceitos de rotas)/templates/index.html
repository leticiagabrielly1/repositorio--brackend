<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Início</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin-bottom: 10px;
        }

        a {
            display: inline-block;
            padding: 8px 16px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
        }

        a:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <h1>Página Inicial</h1>
    <ul>
        <li><a href="/login">Login</a></li>
        <li><a href="/alunos">Alunos</a></li>
    </ul>
</body>
</html>
