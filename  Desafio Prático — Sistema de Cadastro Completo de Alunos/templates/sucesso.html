<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro Realizado</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f0f1a, #1b1b35);
        color: white;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        background-color: #24243e;
        width: 450px;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
        text-align: center;
        color: #7cff9b;
        margin-bottom: 25px;
        font-size: 25px;
    }

    h3 {
        text-align: center;
        margin-bottom: 25px;
        color: #ffffff;
        font-size: 20px;
    }

    .dados {
        background-color: #363653;
        padding: 18px;
        border-radius: 10px;
    }

    .dados p {
        margin-bottom: 14px;
        font-size: 16px;
        border-bottom: 1px solid #505070;
        padding-bottom: 10px;
    }

    .dados p:last-child {
        margin-bottom: 0;
        border-bottom: none;
        padding-bottom: 0;
    }

    strong {
        color: #8d85ff;
    }

    .botao {
        display: block;
        text-align: center;
        text-decoration: none;
        background-color: #6c63ff;
        color: white;
        padding: 13px;
        border-radius: 8px;
        margin-top: 25px;
        font-weight: bold;
        transition: 0.3s;
    }

    .botao:hover {
        background-color: #574bdb;
        transform: scale(1.02);
    }
</style>

</head>

<body>

<div class="container">

    <h1>✅ Cadastro realizado com sucesso!</h1>

    <h3>🎮 Dados do Aluno</h3>

    <div class="dados">

        <p><strong>Nome:</strong> {{ nome }}</p>

        <p><strong>E-mail:</strong> {{ email }}</p>

        <p><strong>Telefone:</strong> {{ telefone }}</p>

        <p><strong>CPF:</strong> {{ cpf }}</p>

        <p><strong>Cidade:</strong> {{ cidade }}</p>

        <p><strong>Estado:</strong> {{ estado }}</p>

        <p><strong>Curso:</strong> {{ curso }}</p>

        <p><strong>Idade:</strong> {{ idade }}</p>

    </div>

    <a href="/" class="botao">← Novo Cadastro</a>

</div>

</body>
</html>
