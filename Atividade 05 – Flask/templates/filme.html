<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ nome }}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, {{ cor1 }}, {{ cor2 }});
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            padding: 30px;
            max-width: 380px;
            text-align: center;
            animation: subir 0.5s ease-out;
        }

        @keyframes subir {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .card h1 {
            margin: 20px 0 10px;
            font-size: 28px;
            color: #222;
            letter-spacing: 1px;
        }

        .badge {
            display: inline-block;
            background: {{ cor1 }};
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        
        }

        .card p {
            color: #555;
            font-size: 15px;
            line-height: 1.5;
            margin: 0;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: {{ cor1 }};
            text-decoration: none;
            font-weight: bold;
        }

        .voltar:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="{{ url_for('static', filename=imagem) }}" alt="{{ nome }}">
        <span class="badge">Gênero</span>
        <h1>{{ nome }}</h1>
        <p>{{ descricao }}</p>
        <a class="voltar" href="/">&larr; Ver outros gêneros</a>
    </div>
</body>
</html>
